<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景:圆角渐变方砖 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 顶部柔和高光,增加立体感 -->
  <rect x="0" y="0" width="512" height="256" rx="116" fill="#ffffff" opacity="0.06"/>

  <!-- 字母 E(白色,由圆角矩形组合,字体无关) -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="156" y="118" width="58" height="278" rx="29"/>
    <rect x="156" y="118" width="202" height="58" rx="29"/>
    <rect x="156" y="228" width="160" height="52" rx="26"/>
    <rect x="156" y="338" width="202" height="58" rx="29"/>
  </g>

  <!-- Flow 流线(青色,位于 E 下方) -->
  <path d="M120 426 Q 196 392 256 426 T 392 426"
        fill="none" stroke="url(#flow)" stroke-width="24" stroke-linecap="round"/>

  <!-- 点缀小圆点 -->
  <circle cx="392" cy="120" r="20" fill="#67e8f9" opacity="0.95"/>
</svg>
